<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="/js/index.js"></script>
</head>
<div id="header"></div>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">

            <main class="col-md-6">
                <form>
                    <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

                    <div class="form-floating">
                        <input id="id" type="id" class="form-control" id="floatingInput" placeholder="ID">
                        <label for="floatingInput">ID</label>
                    </div>
                    <div class="form-floating mt-2">
                        <input id="password" type="password" class="form-control" id="floatingPassword"
                            placeholder="Password">
                        <label for="floatingPassword">Password</label>
                    </div>

                    <input type="button" id="submit" class="btn btn-primary w-100 py-2 mt-3" value="Sign in">
                    <p class="mt-3">Not a member? <a href="signup.html">Sign up</a></p>
                </form>
            </main>
        </div>
    </div>
</body>

<script>
    $("#header").load("component/header.html");
    $(document).ready(function () {
        $("#submit").click(function () {
            requestSignIn($("#id").val(), $("#password").val())
        });
    });


</script>

</html>
